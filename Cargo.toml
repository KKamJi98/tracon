[package]
name = "tracon"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Approach control for your agent sessions. See who is holding, and go to them."
repository = "https://github.com/KKamJi98/tracon"
categories = ["command-line-utilities"]
keywords = ["tui", "monitoring", "claude", "codex", "agents"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[dev-dependencies]
tempfile = "3"
